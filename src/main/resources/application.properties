spring.application.name=RatingSystem

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rating_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:rating_system}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

rating.ai.api-key=${AI_API_KEY:}
rating.ai.base-url=${AI_BASE_URL:https://api.deepseek.com}
rating.ai.model=${AI_MODEL:deepseek-flash}
rating.ai.connect-timeout=5s
rating.ai.read-timeout=60s
rating.ai.max-tokens=1200
rating.grading.running-timeout=5m
