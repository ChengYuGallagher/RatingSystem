spring.datasource.url=jdbc:h2:mem:rating_system;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

rating.ai.api-key=
rating.ai.base-url=https://api.deepseek.com
rating.ai.model=test-model
rating.ai.connect-timeout=1s
rating.ai.read-timeout=1s
rating.ai.max-tokens=100
rating.ai-settings.directory=${java.io.tmpdir}/ratingsystem-tests/${random.uuid}
rating.grading.running-timeout=5m
